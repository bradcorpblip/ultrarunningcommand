<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Ultra Running Command Centre V6.3</title>
<style>
:root{--bg:#0b1220;--card:#172033;--accent:#ff6b35;--text:#fff}
body{margin:0;font-family:Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
.hero{padding:40px;background:linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.5)),url(https://images.unsplash.com/photo-1464822759023-fed622ff2c3b);background-size:cover}
.stats,.cards{display:grid;gap:15px}.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));padding:20px}.cards{grid-template-columns:repeat(auto-fit,minmax(420px,1fr));padding:20px}.card{background:#172033;padding:15px;border-radius:14px}
select,input,textarea{width:100%;margin:4px 0;padding:8px}textarea{min-height:80px}.prog{height:10px;background:#333;border-radius:10px}.fill{height:10px;background:var(--accent)}a{color:#7dd3fc}
.toggle-group{display:flex;gap:8px;margin:10px 0}.toggle-btn{border:none;padding:8px 14px;border-radius:8px;color:#fff;background:#555;cursor:pointer}.active.A{background:#2563eb}.active.B{background:#22c55e}.active.C{background:#eab308}
.toolbar{padding:15px}.toolbar button{padding:10px;margin-right:8px}.race-header{cursor:pointer;display:flex;align-items:center;gap:10px;font-size:1.3rem;font-weight:bold;padding:8px 0;}.arrow{transition:transform 0.2s ease;display:inline-block;}details[open].arrow{transform:rotate(90deg);}.race-content{margin-top:10px;}
</style></head><body>
<div class='hero'><h1>Ultra Running Command Centre 2026-2027 V6.3</h1><div id='next'></div></div>
<div class='toolbar'><button onclick='exportData()'>Export Backup</button><button onclick='document.getElementById("imp").click()'>Import Backup</button><input id='imp' type='file' style='display:none' onchange='importData(event)'><span id='seasonTotal'></span></div>
<div class='stats' id='stats'></div><div class='cards' id='cards'></div>
<script>
const races=[{name:'Clint Eastwood Backyard Ultra',date:'2026-08-14',loc:'Rocklea QLD',dist:'Backyard'},{name:'Blackall50',date:'2026-10-17',loc:'Mapleton QLD',dist:'52km'},{name:'UTMB Kosci100',date:'2026-11-27',loc:'Perisher to Thredbo',dist:'106km'},{name:'Tarawera T50',date:'2027-02-13',loc:'Rotorua NZ',dist:'52km'},{name:'Noosa Ultra Trail',date:'2027-03-20',loc:'Noosa',dist:'80km'},{name:'UTA50',date:'2027-05-15',loc:'Katoomba',dist:'51km'},{name:'The Guzzler 53',date:'2027-07-17',loc:'Brisbane',dist:'53km'},{name:'Hells Bells 24hr Adventure Race',date:'2027-08-07',loc:'Mudjimba, Sunshine Coast QLD',dist:'24hr Adventure Race'},{name:'Blackall100',date:'2027-10-16',loc:'Sunshine Coast Hinterland',dist:'100km'},{name:'Great Ocean Road Ultra 100',date:'2027-11-27',loc:'Victoria',dist:'100km'}];
const d=x=>Math.ceil((new Date(x)-new Date())/86400000);
const nextRace=races.filter(r=>d(r.date)>0).sort((a,b)=>d(a.date)-d(b.date))[0];
document.getElementById('next').innerHTML ='<h2>Next Race: ' + nextRace.name + ' - ' + d(nextRace.date) + ' days</h2>' +'<div>' + new Date(nextRace.date).toLocaleDateString('en-AU', {weekday: 'long',day: 'numeric',month: 'long',year: 'numeric'}) + '</div>';
document.getElementById('stats').innerHTML='<div class=card>Total Events<br>'+races.length+'</div>';
function save(el){localStorage.setItem(el.id,el.value);calcTotal();}
function setPriority(i,v){localStorage.setItem('prio'+i,v);document.querySelectorAll('.p'+i).forEach(b=>b.classList.remove('active'));document.getElementById('p'+i+v).classList.add('active');}
function exportData(){let o={};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);o[k]=localStorage.getItem(k);}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download='UltraRunningBackup.json';a.click();}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let d=JSON.parse(r.result);Object.keys(d).forEach(k=>localStorage.setItem(k,d[k]));location.reload();};r.readAsText(f);}
function calcTotal(){let t=0;document.querySelectorAll('.cost').forEach(x=>t+=Number(x.value||0));document.getElementById('seasonTotal').innerHTML='Season Budget Total: $'+t.toFixed(2);}
const cards=document.getElementById('cards');
races.forEach((r,i)=>{if (r.date.startsWith('2027') &&!document.getElementById('races2027')) {cards.innerHTML += `<div id="races2027"style="grid-column:1/-1;font-size:1.8rem;font-weight:bold;padding:10px 0;">2027 Races</div>`;}cards.innerHTML+=`<div class='card'>
<details><summary class='race-header'><span class='arrow'>▶</span>${r.name}
</summary>
<div class='race-content'>><div class='toggle-group'><button id='p${i}A' class='toggle-btn p${i} A' onclick="setPriority(${i},'A')">A</button><button id='p${i}B' class='toggle-btn p${i} B' onclick="setPriority(${i},'B')">B</button><button id='p${i}C' class='toggle-btn p${i} C' onclick="setPriority(${i},'C')">C</button></div><p>${r.loc}</p><p>${new Date(r.date).toLocaleDateString('en-AU', {day: 'numeric',month: 'long',year: 'numeric'})}</p><p>${d(r.date)} days | ${(d(r.date)/7).toFixed(1)} weeks</p><div class='prog'><div class='fill' style='width:${Math.max(2,100-d(r.date)/6)}%'></div></div><details><summary>Event Details</summary><p>Distance: ${r.dist}</p><textarea id='event${i}' onchange='save(this)' placeholder='Event notes'></textarea></details><details open><summary>Logistics & Training</summary><label>Status<select id='status${i}' onchange='save(this)'><option>Not Started</option><option>Base</option><option>Build</option><option>Peak</option><option>Taper</option><option>Race Week</option><option>Completed</option></select></label><label>Registered<select id='reg${i}' onchange='save(this)'><option>Not Yet</option><option>Yes</option></select></label><label>Flights<select id='f${i}' onchange='save(this)'><option>Not Needed</option><option>To Be Booked</option><option>Booked / Confirmed</option></select></label><label>Accommodation<select id='a${i}' onchange='save(this)'><option>Not Needed</option><option>To Be Booked</option><option>Booked / Confirmed</option></select></label><label>Rental Car<select id='c${i}' onchange='save(this)'><option>Not Needed</option><option>To Be Booked</option><option>Booked / Confirmed</option></select></label><label>Support Crew<select id='crew${i}' onchange='save(this)'><option>No</option><option>Yes</option></select></label><textarea id='notes${i}' onchange='save(this)' placeholder='Race notes'></textarea></details><details><summary>Costs</summary><input class='cost' id='entry${i}' type='number' onchange='save(this)' placeholder='Race Entry Cost'><input class='cost' id='flightcost${i}' type='number' onchange='save(this)' placeholder='Flights Cost'><input class='cost' id='accomcost${i}' type='number' onchange='save(this)' placeholder='Accommodation Cost'><input class='cost' id='carcost${i}' type='number' onchange='save(this)' placeholder='Car Hire Cost'><input class='cost' id='foodcost${i}' type='number' onchange='save(this)' placeholder='Food Cost'><input class='cost' id='gearcost${i}' type='number' onchange='save(this)' placeholder='Gear Cost'><input id='budget${i}' onchange='save(this)' placeholder='Budget Notes'></details>

</div></details>
</div>`});
window.onload=()=>{document.querySelectorAll('input,select,textarea').forEach(el=>{const v=localStorage.getItem(el.id);if(v!==null)el.value=v;});for(let i=0;i<races.length;i++)setPriority(i,localStorage.getItem('prio'+i)||'C');calcTotal();};
</script></body></html>
